services:
  web:
    image: nginx:stable-alpine
    container_name: tp2-web
    restart: always
    ports:
      - "10.10.0.1:80:80"
    volumes:
      - /home:/home:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/html:/usr/share/nginx/html:ro
      - ./web/htpasswd:/etc/nginx/htpasswd:ro

  netdata:
    image: netdata/netdata:stable
    container_name: tp2-netdata
    hostname: servidor-tp2
    restart: always
    # Red del host para ver las interfaces reales (enp0s3, wg0)
    network_mode: host
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - DO_NOT_TRACK=1
    volumes:
      - ./netdata/netdata.conf:/etc/netdata/netdata.conf:ro
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  netdatalib:
  netdatacache:
