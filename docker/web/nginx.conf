server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No servir archivos ocultos (.ssh, .bashrc, etc.)
    location ~ /\. {
        deny all;
    }

    # /~usuario -> /~usuario/
    location ~ ^/~([a-z_][a-z0-9_-]*)$ {
        return 301 /~$1/;
    }

    # Bonus: directorio protegido con autenticación HTTP básica
    location ~ ^/~kakashi/privado(/.*)?$ {
        auth_basic "Zona privada";
        auth_basic_user_file /etc/nginx/htpasswd;
        alias /home/kakashi/public_html/privado$1;
        autoindex on;
    }

    # Directorios públicos de los usuarios: /~usuario/ -> /home/usuario/public_html/
    location ~ ^/~([a-z_][a-z0-9_-]*)(/.*)$ {
        alias /home/$1/public_html$2;
        autoindex on;
    }
}
