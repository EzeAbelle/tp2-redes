#!/usr/sbin/nft -f
# TP2 - Firewall del servidor
# enp0s3 = interfaz pública | wg0 = interfaz VPN

table inet tp2
delete table inet tp2

table inet tp2 {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # ICMP (ping) limitado
        ip protocol icmp limit rate 5/second accept
        meta l4proto ipv6-icmp accept

        # Interfaz PUBLICA: solo WireGuard y SSH de emergencia
        iifname "enp0s3" udp dport 51820 accept
        iifname "enp0s3" tcp dport 22 ct state new limit rate 10/minute accept

        # Interfaz VPN: acceso a todos los servicios
        iifname "wg0" accept

        # Todo lo demas se descarta y se registra
        limit rate 5/minute log prefix "nft-drop: "
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        # Bloquea cualquier puerto de Docker publicado hacia la interfaz publica
        iifname "enp0s3" ct status dnat drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
